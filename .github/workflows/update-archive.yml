name: Update Briosa archive
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7,19 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run import:data
      - run: npm run import:standings
      - run: npm run import:clubs
      - run: npm run export:static
      - run: npm run check
      - name: Commit data and images only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briosa.sqlite public/media/clubs public/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Briosa archive"
            git push
          fi
